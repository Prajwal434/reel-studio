# Builds the Mac (Apple Silicon) and Windows installers with the engine bundled inside, and publishes them on a
# GitHub release when a version tag (v*) is pushed. Run manually (workflow_dispatch) to just get the build artifacts.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            bundles: app,dmg
            asset: desktop/src-tauri/target/release/bundle/dmg/*.dmg
            name: ReelStudio-mac-arm64.dmg
          - os: windows-latest
            bundles: nsis
            asset: desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            name: ReelStudio-windows-x64-setup.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - name: Bundle engine (macOS)
        if: runner.os == 'macOS'
        run: zsh build/bundle_engine_mac.sh
      - name: Bundle engine (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build/bundle_engine_windows.ps1
      - name: Build app
        working-directory: desktop
        run: |
          npm ci
          npx tauri build --bundles ${{ matrix.bundles }}
      - name: Collect installer
        shell: bash
        run: |
          mkdir -p dist
          cp ${{ matrix.asset }} "dist/${{ matrix.name }}"
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
