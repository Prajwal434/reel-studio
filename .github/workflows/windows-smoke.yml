# Real-machine test of the Windows build: bundle the engine, run the first-launch model download and make three kinds of
# reels end to end, then build the installer, install it silently and check the app starts and stays up.
# Runs on pushes to ci/** branches and on demand (Actions tab > windows-smoke > Run workflow).
name: windows-smoke
on:
  push:
    branches: ["ci/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      RS_MODELS: ${{ runner.temp }}\models
      RS_WHISPER_DIR: ${{ runner.temp }}\models\whisper
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: dtolnay/rust-toolchain@stable
      - name: Bundle engine (what the installer ships)
        shell: pwsh
        run: ./build/bundle_engine_windows.ps1
      - name: Engine end to end (first launch + three reels)
        shell: pwsh
        run: |
          $dist = "desktop\src-tauri\engine-dist"
          $env:RS_BIN = (Resolve-Path "$dist\bin").Path
          & "$dist\python\python.exe" .github\smoke\smoke_test.py "$dist\app\engine.py" "$env:RUNNER_TEMP\smoke"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Build installer
        working-directory: desktop
        run: |
          npm ci
          npx tauri build --bundles nsis
      - name: Install silently and launch the app
        shell: pwsh
        run: |
          $setup = Get-ChildItem desktop\src-tauri\target\release\bundle\nsis\*-setup.exe | Select-Object -First 1
          Write-Host "installer: $($setup.Name) ($([math]::Round($setup.Length / 1MB)) MB)"
          Start-Process $setup.FullName -ArgumentList "/S" -Wait
          $exe = Get-ChildItem "$env:LOCALAPPDATA", "$env:ProgramFiles" -Recurse -Depth 3 -Filter "*.exe" -ErrorAction SilentlyContinue |
                 Where-Object { $_.Name -match "^(reel-studio|Reel Studio)\.exe$" } | Select-Object -First 1
          if (-not $exe) { Write-Error "installed app not found"; exit 1 }
          Write-Host "installed: $($exe.FullName)"
          $eng = Join-Path $exe.DirectoryName "engine"
          if (-not (Test-Path "$eng\app\engine.py")) { Write-Error "bundled engine missing in the install"; exit 1 }
          & "$eng\python\python.exe" "$eng\app\engine.py" check
          $p = Start-Process $exe.FullName -PassThru
          Start-Sleep -Seconds 30
          if ($p.HasExited) { Write-Error "app exited right after launch (code $($p.ExitCode))"; exit 1 }
          Write-Host "app is running after 30 s (pid $($p.Id))"
          Stop-Process -Id $p.Id -Force
